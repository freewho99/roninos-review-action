name: 'RoninOS Review'
description: >-
  Run the deterministic RoninOS aperture on a pull request, publish a summary,
  line-anchored review comments, and an idempotent check run. Runs in the
  caller's GitHub runner; no RoninOS-hosted code custody is required.

branding:
  icon: 'shield'
  color: 'green'

inputs:
  github-token:
    description: 'Token with pull-requests: write and checks: write (normally the workflow GITHUB_TOKEN).'
    required: true
  roninos-version:
    description: 'Exact published roninos package version to run.'
    required: true
    default: '3.1.2'
  base-ref:
    description: 'Base branch/ref for the diff. Defaults to the PR base branch or main.'
    required: false
    default: ''
  head-sha:
    description: 'PR head SHA for the check run/review. Defaults to github.event.pull_request.head.sha or github.sha.'
    required: false
    default: ''
  base-sha:
    description: 'PR base SHA for the exact diff. Defaults to the PR base or the base ref.'
    required: false
    default: ''
  exclude:
    description: 'Comma-free glob excluded from the audit. Default excludes helper scripts; set empty to include them.'
    required: false
    default: 'scripts/**'
  check-name:
    description: 'Check run name.'
    required: false
    default: 'RoninOS Review'
  fail-on-violation:
    description: 'Fail the job when the audit reports a modeled invariant violation.'
    required: false
    default: 'false'
  strict-coverage-globs:
    description: 'Comma-separated glob patterns where unmodeled files (UNASSESSED_FORMAT) trigger a merge block.'
    required: false
    default: ''
  wasm-dir:
    description: 'Path to compiled Tree-Sitter WASM grammar binaries.'
    required: false
    default: './wasm'

outputs:
  conclusion:
    description: 'success or failure from the deterministic audit.'
    value: ${{ steps.audit.outputs.conclusion }}
  receipt:
    description: 'Path to the receipt JSON.'
    value: ${{ steps.audit.outputs.receipt }}

runs:
  using: 'composite'
  steps:
    - name: Require a checked-out repository
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -d .git ]; then
          echo "::error::RoninOS Review requires actions/checkout with fetch-depth: 0 before this action."
          exit 1
        fi

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install RoninOS CLI and review poster
      id: install
      shell: bash
      env:
        IN_VERSION: ${{ inputs.roninos-version }}
        RONINOS_DEST: ${{ runner.temp }}/roninos-action
      run: |
        set -euo pipefail
        DEST="$RUNNER_TEMP/roninos-action"
        mkdir -p "$DEST"
        npm install --no-save --no-audit --no-fund --prefix "$DEST" "roninos@${IN_VERSION}" "web-tree-sitter@0.20.8" "@babel/parser@^7.26.0"
        cp "${{ github.action_path }}/post-review.mjs" "$DEST/post-review.mjs"
        cp "${{ github.action_path }}/filter-receipt.mjs" "$DEST/filter-receipt.mjs"
        rm -rf "$DEST/lib"
        cp -R "${{ github.action_path }}/lib" "$DEST/lib"
        if [ -f "$DEST/lib/tricorderEngine.js" ] && [ -d "$DEST/node_modules/roninos/lib" ]; then
          cp "$DEST/lib/tricorderEngine.js" "$DEST/node_modules/roninos/lib/tricorderEngine.js"
        fi
        if [ -f "$DEST/node_modules/roninos/bin/roninos.mjs" ]; then
          python3 "${{ github.action_path }}/patch-cli.py"
        fi
        mkdir -p "$DEST/public"
        rm -rf "$DEST/public/tree-sitter"
        cp -R "$DEST/node_modules/roninos/lib/tree-sitter" "$DEST/public/tree-sitter"
        echo "dest=$DEST" >> "$GITHUB_OUTPUT"

    - name: Run deterministic aperture audit
      id: audit
      shell: bash
      env:
        IN_REPO: ${{ github.repository }}
        IN_BASE_REF: ${{ inputs.base-ref }}
        IN_BASE_SHA: ${{ inputs.base-sha }}
        IN_HEAD_SHA: ${{ inputs.head-sha }}
        IN_EXCLUDE: ${{ inputs.exclude }}
        DEST: ${{ steps.install.outputs.dest }}
      run: |
        set +e
        BASE_REF="$IN_BASE_REF"
        if [ -z "$BASE_REF" ]; then BASE_REF="${GITHUB_BASE_REF:-main}"; fi
        if [ -n "$IN_BASE_SHA" ] && [ -n "$IN_HEAD_SHA" ]; then
          TARGET="${IN_BASE_SHA}...${IN_HEAD_SHA}"
        else
          TARGET="origin/${BASE_REF}...HEAD"
        fi
        if ! git rev-parse "$TARGET" >/dev/null 2>&1; then TARGET="HEAD~1"; fi
        RECEIPT="$RUNNER_TEMP/roninos-receipt.json"
        EXCLUDE_ARGS=()
        if [ -n "$IN_EXCLUDE" ]; then EXCLUDE_ARGS=(--exclude "$IN_EXCLUDE"); fi
        RONINOS_NO_DAEMON=1 "$DEST/node_modules/.bin/roninos" audit "$TARGET" "${EXCLUDE_ARGS[@]}" --json > "$RECEIPT"
        STATUS=$?
        if [ -n "$IN_EXCLUDE" ] && [ -s "$RECEIPT" ]; then
          node "$DEST/filter-receipt.mjs" "$RECEIPT" "$IN_EXCLUDE" || STATUS=1
        fi
        CONCLUSION="success"
        if [ "$STATUS" -ne 0 ]; then CONCLUSION="failure"; fi
        echo "status=$STATUS" >> "$GITHUB_OUTPUT"
        echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
        echo "receipt=$RECEIPT" >> "$GITHUB_OUTPUT"
        if [ -s "$RECEIPT" ]; then
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); console.log('receipt '+r.receiptId+' status '+r.status);" "$RECEIPT" \
            || true
        fi
        exit 0

    - name: Publish summary, inline review, and check run
      id: publish
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DEST: ${{ steps.install.outputs.dest }}
        RECEIPT: ${{ steps.audit.outputs.receipt }}
        IN_REPO: ${{ github.repository }}
        IN_PR: ${{ github.event.pull_request.number }}
        IN_HEAD: ${{ inputs.head-sha }}
        IN_CHECK: ${{ inputs.check-name }}
        IN_STRICT_COVERAGE: ${{ inputs.strict-coverage-globs }}
      run: |
        set -euo pipefail
        if [ -z "${IN_PR:-}" ]; then
          echo "::notice::No pull request number in this event; skipping review publication."
          exit 0
        fi
        if [ -z "${IN_HEAD:-}" ]; then IN_HEAD="${GITHUB_SHA:-}"; fi
        PUBLIC_KEY="$(cat "${HOME}/.roninos/keys/ed25519.pub.pem" 2>/dev/null || true)"
        PRIVATE_KEY="$(cat "${HOME}/.roninos/keys/ed25519.pem" 2>/dev/null || true)"
        cd "$DEST"
        node post-review.mjs \
          --receipt "$RECEIPT" \
          --repo "$IN_REPO" \
          --pr "$IN_PR" \
          --token "$GITHUB_TOKEN" \
          --head "$IN_HEAD" \
          --check-name "$IN_CHECK" \
          --strict-coverage-globs "$IN_STRICT_COVERAGE" \
          --public-key "$PUBLIC_KEY" \
          --private-key "$PRIVATE_KEY"

    - name: Enforce configured violation policy
      if: ${{ inputs.fail-on-violation == 'true' && steps.audit.outputs.status != '0' }}
      shell: bash
      run: |
        echo "::error::RoninOS reported a modeled invariant violation and fail-on-violation=true."
        exit 1

    - name: Upload receipt
      if: always() && steps.audit.outputs.receipt != ''
      uses: actions/upload-artifact@v4
      with:
        name: roninos-review-receipt
        path: ${{ steps.audit.outputs.receipt }}
        if-no-files-found: warn
